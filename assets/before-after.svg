<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="The same agent report without truegreen (all tests pass, the test change is a footnote) and with truegreen (Status: BLOCKED, the test change is a question for you)">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; fill: #c9d1d9; }
    .label { font-size: 12px; letter-spacing: 1.5px; fill: #8b949e; }
    .note { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; font-style: italic; fill: #8b949e; }
    .dim { fill: #8b949e; }
    .green { fill: #3fb950; }
    .red { fill: #f85149; }
    .amber { fill: #d29922; font-weight: bold; }
  </style>
  <rect width="900" height="300" rx="12" fill="#0d1117"/>

  <rect x="20" y="20" width="420" height="260" rx="8" fill="#161b22" stroke="#30363d"/>
  <circle cx="44" cy="46" r="5" fill="#f85149"/>
  <text x="58" y="50" class="label">WITHOUT TRUEGREEN</text>
  <text x="44" y="94" class="green">All tests pass and CI is green.</text>
  <text x="44" y="118">I fixed the discount calculation.</text>
  <text x="44" y="142">I also <tspan class="red">updated the expected value</tspan></text>
  <text x="44" y="166"><tspan class="red">in test_checkout_integration</tspan>,</text>
  <text x="44" y="190">which looked outdated.</text>
  <text x="44" y="266" class="note">The test change is a footnote, and already made.</text>

  <rect x="460" y="20" width="420" height="260" rx="8" fill="#161b22" stroke="#30363d"/>
  <circle cx="484" cy="46" r="5" fill="#3fb950"/>
  <text x="498" y="50" class="label">WITH TRUEGREEN</text>
  <text x="484" y="94"><tspan class="dim">Status:</tspan> <tspan class="amber">BLOCKED</tspan></text>
  <text x="484" y="118"><tspan class="dim">Evidence:</tspan> 4 run, 1 failed</text>
  <text x="484" y="142"><tspan class="dim">Tests changed:</tspan> <tspan class="green">none</tspan></text>
  <text x="484" y="166"><tspan class="dim">Open problems:</tspan></text>
  <text x="500" y="190">test_checkout_integration expects</text>
  <text x="500" y="214">218.00, but the spec gives 214.20.</text>
  <text x="500" y="238">Proposed: 218.00 -&gt; 214.20</text>
  <text x="484" y="266" class="note">The test change is a question for you.</text>
</svg>
